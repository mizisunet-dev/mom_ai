    <text x="24" y="184" fill="#ff7b72" font-weight="bold">## Blocking</text>
    <text x="24" y="206"><tspan fill="#ff7b72">[ ]</tspan> README says enough to be useful <tspan fill="#8b949e">— 16 words of prose</tspan></text>
    <text x="24" y="226"><tspan fill="#ff7b72">[ ]</tspan> README has no leftover placeholder text <tspan fill="#8b949e">— TODO/TBD/FIXME marker</tspan></text>
    <text x="24" y="246"><tspan fill="#ff7b72">[ ]</tspan> README links resolve <tspan fill="#8b949e">— broken: docs/setup.md</tspan></text>
    <text x="24" y="266"><tspan fill="#ff7b72">[ ]</tspan> LICENSE present <tspan fill="#8b949e">— no LICENSE file</tspan></text>
    <text x="24" y="286"><tspan fill="#ff7b72">[ ]</tspan> .gitignore present <tspan fill="#8b949e">— no .gitignore</tspan></text>
    <text x="24" y="306"><tspan fill="#ff7b72">[ ]</tspan> No credential-shaped files committed <tspan fill="#8b949e">— .env</tspan></text>
    <text x="44" y="326" fill="#8b949e">↳ rotate anything it contained; deleting it does not erase history</text>
    <text x="24" y="346"><tspan fill="#ff7b72">[ ]</tspan> No dependency directories committed <tspan fill="#8b949e">— node_modules/</tspan></text>

    <text x="24" y="382" fill="#d29922" font-weight="bold">## Worth fixing</text>
