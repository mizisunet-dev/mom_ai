    <text x="24" y="424"><tspan fill="#d29922">[ ]</tspan> README shows the project <tspan fill="#8b949e">— no screenshot or sample output</tspan></text>
    <text x="24" y="444"><tspan fill="#d29922">[ ]</tspan> Continuous integration configured <tspan fill="#8b949e">— no CI workflow</tspan></text>
    <text x="24" y="464"><tspan fill="#d29922">[ ]</tspan> Commit history tells a story <tspan fill="#8b949e">— a single commit</tspan></text>
